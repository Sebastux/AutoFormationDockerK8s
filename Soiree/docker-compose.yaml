services:
  dns:
    build:
      context: ./Bind9/
      tags:
        - "dns_vins:1.0.0"
        - "dns_vins:latest"
    container_name: dns_vins
    image: dns_vins:1.0.0
    restart: unless-stopped
    volumes:
      - ./Bind9/config/named.conf.local:/etc/bind/named.conf.local
      - ./Bind9/config/db.saveursetvins.lan:/etc/bind/db.saveursetvins.lan
      - ./Bind9/config/db.192.168.0:/etc/bind/db.192.168.0
    ports:
      - "5353:53"
    networks:
      - reseau-vins

#  step-ca:
#    image: smallstep/step-ca:latest
#    container_name: step-ca_vins
#    restart: unless-stopped
#    ports:
#      - "9000:9000"
#    environment:
#      - DOCKER_STEPCA_INIT_NAME=SaveursEtVinsCA
#      - DOCKER_STEPCA_INIT_DNS_NAMES=localhost,ca.saveursetvins.lan,step-ca
#      - DOCKER_STEPCA_INIT_PROVISIONER_NAME=admin
#    volumes:
#      - step_data:/home/step
#    networks:
#      - reseau-vins
#    depends_on:
#      - dns

  mariadb:
    build:
      context: ./mariadb/
      tags:
        - "mariadb_vins:1.0.0"
        - "mariadb_vins:latest"
    container_name: mariadb_vins
    image: mariadb_vins:1.0.0
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: Pou3tt€
      MARIADB_DATABASE: saveursvins
      MARIADB_USER: questionnaire
      MARIADB_PASSWORD: Pou3tt€Pou3tt€
    volumes:
      - ./mariadb/DB:/var/lib/mysql:rw
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro
    networks:
      - reseau-vins
    depends_on:
      - dns

  phpmyadmin:
    build:
      context: ./phpmyadmin/
      tags:
        - "phpmyadmin_vins:1.0.0"
        - "phpmyadmin_vins:latest"
    container_name: phpmyadmin_vins
    image: phpmyadmin_vins:1.0.0
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_ARBITRARY: 1
      TZ: Europe/Paris
      MYSQL_ROOT_PASSWORD: Pou3tt€
      MARIADB_ROOT_HOST: localhost
    ports:
      - "8080:80"
    networks:
      - reseau-vins
    depends_on:
      - dns
      - mariadb

  php_fpm:
    build:
      context: ./php/
      tags:
        - "php-fpm_vins:1.0.0"
        - "php-fpm_vins:latest"
    container_name: php-fpm_vins
    image: php-fpm_vins:1.0.0
    restart: unless-stopped
    volumes:
      - ./nginx/site:/var/www/html:rw
    networks:
      - reseau-vins
    depends_on:
      - dns

  web:
    build:
      context: ./nginx/
      tags:
        - "nginx_vins:1.0.0"
        - "nginx_vins:latest"
    container_name: nginx_vins
    image: nginx_vins:1.0.0
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/site:/usr/share/nginx/html:rw
      - ./nginx/config:/etc/nginx/conf.d/:ro
      - ./nginx/logs:/var/log/nginx
    networks:
      - reseau-vins
    depends_on:
      - dns
      - php_fpm
      - mariadb

networks:
  reseau-vins:
    driver: bridge

